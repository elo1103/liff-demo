<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>打卡系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* Design tokens — Apple-inspired (align with design-reference) */
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --border: #d2d2d7;
            --divider: #e8e8ed;
            --blue: #007aff;
            --green: #34c759;
            --green-bg: #edfbf1;
            --red: #ff3b30;
            --red-bg: #fff2f1;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --shadow-card: 0 2px 12px rgba(0,0,0,0.06);
            --transition: 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            --font: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.5;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 32px 24px;
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--blue);
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .greeting {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform var(--transition), background var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-clock-in {
            background: var(--blue);
            color: #fff;
        }

        .btn-clock-in:hover:not(:disabled) {
            background: #0066d6;
        }

        .btn-clock-out {
            background: var(--bg);
            color: var(--text-primary);
            border: 1px solid var(--divider);
        }

        .btn-clock-out:hover:not(:disabled) {
            background: #ebebed;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .result {
            background: var(--bg);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--divider);
            transition: all var(--transition);
        }

        .result.success {
            background: var(--green-bg);
            border-color: var(--green);
            color: var(--text-primary);
            animation: successPulse 0.4s ease-out;
        }

        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        .result-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .result-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .result-time {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--divider);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-tertiary);
            font-size: 15px;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 0.5px solid var(--divider);
        }

        .tab {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            bottom: -0.5px;
        }

        .tab.active {
            color: var(--blue);
            border-bottom-color: var(--blue);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-container {
            margin-top: 16px;
            padding: 20px 16px;
            background: var(--surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .chart-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin-bottom: 14px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 280px;
            margin-bottom: 20px;
        }

        .chart-wrapper:last-child {
            margin-bottom: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--surface);
            padding: 16px 12px;
            border-radius: var(--radius-sm);
            text-align: center;
            box-shadow: var(--shadow-card);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: var(--blue);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
                border-radius: var(--radius-md);
            }
            .greeting { font-size: 20px; }
            .btn { padding: 14px 18px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <div class="loading-text">載入中...</div>
        </div>
    </div>

    <script>
        const LIFF_ID = "2008507273-84v7GBep";
        const SUPABASE_URL = "https://wotnfvxjzrbfqmnvjfsg.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvdG5mdnhqenJiZnFtbnZqZnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE5OTk5MzQsImV4cCI6MjA2NzU3NTkzNH0.xXVgTF2ULgqGsW19HvjRqzxN0budJPt8kDwTIC5ombQ";

        async function main() {
            await liff.init({ liffId: LIFF_ID });

            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            const profile = await liff.getProfile();
            const userId = profile.userId;

            // 取得使用者名稱的第一個字作為頭像
            const avatarText = profile.displayName.charAt(0).toUpperCase();

            document.getElementById("app").innerHTML = `
                <div class="container">
                    <div class="header">
                        <div class="avatar">${avatarText}</div>
                        <div class="greeting">你好，${profile.displayName}</div>
                        <div class="subtitle">請選擇打卡類型</div>
                    </div>
                    <div class="tabs">
                        <button class="tab active" data-tab="clock">打卡</button>
                        <button class="tab" data-tab="stats">統計</button>
                    </div>
                    <div id="clockTab" class="tab-content active">
                        <div class="button-group">
                            <button id="clockIn" class="btn btn-clock-in">📅 上班打卡</button>
                            <button id="clockOut" class="btn btn-clock-out">🏠 下班打卡</button>
                        </div>
                        <div id="result" class="result">
                            <div style="color: #86868b; font-size: 14px;">等待打卡...</div>
                        </div>
                    </div>
                    <div id="statsTab" class="tab-content">
                        <div id="statsContent">
                            <div class="loading">
                                <div class="spinner"></div>
                                <div class="loading-text">載入統計資料...</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // 標籤頁切換
            document.querySelectorAll('.tab').forEach(tab => {
                tab.onclick = () => {
                    const targetTab = tab.dataset.tab;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`${targetTab}Tab`).classList.add('active');
                    
                    if (targetTab === 'stats') {
                        loadStatistics(userId);
                    }
                };
            });

            document.getElementById("clockIn").onclick = () => sendAttendance(userId, "clock_in");
            document.getElementById("clockOut").onclick = () => sendAttendance(userId, "clock_out");
        }

        async function sendAttendance(userId, actionType) {
            const clockInBtn = document.getElementById("clockIn");
            const clockOutBtn = document.getElementById("clockOut");
            const resultDiv = document.getElementById("result");

            // 禁用按鈕
            clockInBtn.disabled = true;
            clockOutBtn.disabled = true;

            // 顯示載入狀態
            resultDiv.className = "result";
            resultDiv.innerHTML = '<div class="spinner" style="width: 30px; height: 30px; border-width: 3px;"></div><div style="margin-top: 8px; color: #86868b;">處理中...</div>';

            try {
                const timestamp = new Date().toISOString();
                const localTime = new Date().toLocaleString('zh-TW', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                const res = await fetch(`${SUPABASE_URL}/rest/v1/attendance_log`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        type: actionType,
                        timestamp: timestamp
                    })
                });

                if (!res.ok) {
                    throw new Error('打卡失敗');
                }

                const data = await res.json();

                // 顯示成功訊息
                resultDiv.className = "result success";
                resultDiv.innerHTML = `
                    <div class="result-icon">${actionType === "clock_in" ? "✅" : "🏠"}</div>
                    <div class="result-text">${actionType === "clock_in" ? "上班打卡成功！" : "下班打卡成功！"}</div>
                    <div class="result-time">${localTime}</div>
                `;

                console.log("Inserted:", data);
                
                // 如果當前在統計頁面，刷新統計數據
                const statsTab = document.getElementById("statsTab");
                if (statsTab && statsTab.classList.contains("active")) {
                    loadStatistics(userId);
                }
            } catch (error) {
                // 顯示錯誤訊息
                resultDiv.className = "result";
                resultDiv.style.background = "#fff2f1";
                resultDiv.style.borderColor = "#ff3b30";
                resultDiv.innerHTML = `
                    <div class="result-icon">❌</div>
                    <div class="result-text" style="color: #ff3b30;">打卡失敗</div>
                    <div class="result-time" style="color: #6e6e73;">請稍後再試</div>
                `;
                console.error("Error:", error);
            } finally {
                // 重新啟用按鈕
                clockInBtn.disabled = false;
                clockOutBtn.disabled = false;
            }
        }

        async function fetchAttendanceHistory(userId, days = 30) {
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - days);

            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/attendance_log?user_id=eq.${userId}&timestamp=gte.${startDate.toISOString()}&timestamp=lte.${endDate.toISOString()}&order=timestamp.asc`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                }
            );

            if (!res.ok) {
                throw new Error('獲取打卡記錄失敗');
            }

            return await res.json();
        }

        function calculateWorkHours(records) {
            const dailyHours = {};
            const clockIns = [];
            const clockOuts = [];

            // 分離上班和下班記錄
            records.forEach(record => {
                const date = new Date(record.timestamp);
                const dateKey = date.toISOString().split('T')[0];
                
                if (!dailyHours[dateKey]) {
                    dailyHours[dateKey] = { clockIn: null, clockOut: null };
                }

                if (record.type === 'clock_in') {
                    dailyHours[dateKey].clockIn = date;
                    clockIns.push({ date: dateKey, time: date });
                } else if (record.type === 'clock_out') {
                    dailyHours[dateKey].clockOut = date;
                    clockOuts.push({ date: dateKey, time: date });
                }
            });

            // 計算每日工時
            const hoursData = [];
            Object.keys(dailyHours).sort().forEach(dateKey => {
                const day = dailyHours[dateKey];
                if (day.clockIn && day.clockOut) {
                    const hours = (day.clockOut - day.clockIn) / (1000 * 60 * 60);
                    hoursData.push({
                        date: dateKey,
                        hours: parseFloat(hours.toFixed(2)),
                        clockIn: day.clockIn,
                        clockOut: day.clockOut
                    });
                }
            });

            return hoursData;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        function formatHours(hours) {
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            return m > 0 ? `${h}小時${m}分鐘` : `${h}小時`;
        }

        async function loadStatistics(userId) {
            const statsContent = document.getElementById("statsContent");
            
            try {
                console.log('開始載入統計資料...');
                const records = await fetchAttendanceHistory(userId, 30);
                console.log('獲取到記錄數:', records.length);
                const hoursData = calculateWorkHours(records);
                console.log('計算後的工時數據:', hoursData);

                if (hoursData.length === 0) {
                    statsContent.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: #86868b;">
                            <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
                            <div>尚無打卡記錄</div>
                        </div>
                    `;
                    return;
                }

                // 計算統計數據
                const totalHours = hoursData.reduce((sum, day) => sum + day.hours, 0);
                const avgHours = totalHours / hoursData.length;
                const thisWeekHours = hoursData
                    .filter(day => {
                        const dayDate = new Date(day.date);
                        const weekAgo = new Date();
                        weekAgo.setDate(weekAgo.getDate() - 7);
                        return dayDate >= weekAgo;
                    })
                    .reduce((sum, day) => sum + day.hours, 0);
                const workDays = hoursData.length;

                // 準備圖表數據（最近7天，如果不足7天則顯示所有數據）
                const recentDays = hoursData.slice(-7);
                const chartLabels = recentDays.length > 0 
                    ? recentDays.map(day => formatDate(day.date))
                    : [];
                const chartData = recentDays.length > 0
                    ? recentDays.map(day => day.hours)
                    : [];

                statsContent.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${formatHours(totalHours)}</div>
                            <div class="stat-label">總工時</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${formatHours(avgHours)}</div>
                            <div class="stat-label">平均每日</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${formatHours(thisWeekHours)}</div>
                            <div class="stat-label">本週工時</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${workDays}</div>
                            <div class="stat-label">工作天數</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div class="chart-title">最近7天工時趨勢</div>
                        <div class="chart-wrapper">
                            <canvas id="dailyHoursChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div class="chart-title">每日工時分佈</div>
                        <div class="chart-wrapper">
                            <canvas id="hoursDistributionChart"></canvas>
                        </div>
                    </div>
                `;

                // 等待 DOM 更新後再創建圖表
                setTimeout(() => {
                    // 檢查 Chart.js 是否已載入
                    if (typeof Chart === 'undefined') {
                        console.error('Chart.js 未載入');
                        statsContent.innerHTML += `
                            <div style="text-align: center; padding: 20px; color: #ff3b30;">
                                <div>圖表庫載入失敗，請重新整理頁面</div>
                            </div>
                        `;
                        return;
                    }

                    console.log('準備創建圖表，數據點數:', chartData.length);
                    console.log('圖表標籤:', chartLabels);
                    console.log('圖表數據:', chartData);

                    // 創建每日工時折線圖
                    const dailyCtx = document.getElementById('dailyHoursChart');
                    if (!dailyCtx) {
                        console.error('找不到 dailyHoursChart canvas');
                        return;
                    }
                    
                    console.log('創建折線圖...');
                    new Chart(dailyCtx.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: '工時（小時）',
                            data: chartData,
                            borderColor: '#007aff',
                            backgroundColor: 'rgba(0, 122, 255, 0.08)',
                            borderWidth: 2.5,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#007aff',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `工時: ${formatHours(context.parsed.y)}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return value + 'h';
                                    }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                }
                            }
                        }
                    }
                    });

                    // 創建每日工時長條圖
                    const distCtx = document.getElementById('hoursDistributionChart');
                    if (!distCtx) {
                        console.error('找不到 hoursDistributionChart canvas');
                        return;
                    }
                    
                    console.log('創建長條圖...');
                    new Chart(distCtx.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: '工時（小時）',
                            data: chartData,
                            backgroundColor: chartData.map((_, i) => 
                                `rgba(0, 122, 255, ${0.2 + (i / chartData.length) * 0.5})`
                            ),
                            borderColor: '#007aff',
                            borderWidth: 1,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `工時: ${formatHours(context.parsed.y)}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return value + 'h';
                                    }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                }
                            }
                        }
                    }
                    });
                    
                    console.log('圖表創建完成！');
                }, 100); // 給 DOM 一點時間更新

            } catch (error) {
                statsContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ff3b30;">
                        <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                        <div>載入統計資料失敗</div>
                        <div style="font-size: 12px; margin-top: 8px; color: #86868b;">${error.message}</div>
                    </div>
                `;
                console.error("Error loading statistics:", error);
            }
        }

        main();
    </script>
