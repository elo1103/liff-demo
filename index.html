<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>打卡系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* Design tokens — Apple-inspired (align with design-reference) */
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --border: #d2d2d7;
            --divider: #e8e8ed;
            --blue: #007aff;
            --green: #34c759;
            --green-bg: #edfbf1;
            --red: #ff3b30;
            --red-bg: #fff2f1;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --shadow-card: 0 2px 12px rgba(0,0,0,0.06);
            --transition: 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            --font: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.5;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 32px 24px;
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--blue);
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .greeting {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 16px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform var(--transition), background var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-clock-in {
            background: var(--blue);
            color: #fff;
        }

        .btn-clock-in:hover:not(:disabled) {
            background: #0066d6;
        }

        .btn-clock-out {
            background: var(--bg);
            color: var(--text-primary);
            border: 1px solid var(--divider);
        }

        .btn-clock-out:hover:not(:disabled) {
            background: #ebebed;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .result {
            background: var(--bg);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--divider);
            transition: all var(--transition);
        }

        .result.success {
            background: var(--green-bg);
            border-color: var(--green);
            color: var(--text-primary);
            animation: successPulse 0.4s ease-out;
        }

        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        .result-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .result-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .result-time {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--divider);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-tertiary);
            font-size: 15px;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 0.5px solid var(--divider);
        }

        .tab {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            bottom: -0.5px;
        }

        .tab.active {
            color: var(--blue);
            border-bottom-color: var(--blue);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-container {
            margin-top: 16px;
            padding: 20px 16px;
            background: var(--surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .chart-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin-bottom: 14px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 280px;
            margin-bottom: 20px;
        }

        .chart-wrapper:last-child {
            margin-bottom: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--surface);
            padding: 16px 12px;
            border-radius: var(--radius-sm);
            text-align: center;
            box-shadow: var(--shadow-card);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: var(--blue);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        /* Form fields (dropdowns) */
        .form-group {
            margin-bottom: 16px;
        }
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .field-select {
            width: 100%;
            font-family: var(--font);
            font-size: 16px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text-primary);
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2386868b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 36px;
            transition: border-color var(--transition);
        }
        .field-select:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
        }
        .field-select.warning { border-color: var(--red); }
        .warning-box {
            background: var(--red-bg);
            border: 1px solid var(--red);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 14px;
            color: var(--red);
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }
        .warning-box.visible { display: block; }
        .stats-filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stats-filters .form-group { margin-bottom: 0; }

        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
                border-radius: var(--radius-md);
            }
            .greeting { font-size: 20px; }
            .btn { padding: 14px 18px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <div class="loading-text">載入中...</div>
        </div>
    </div>

    <script>
        const LIFF_ID = "2008507273-84v7GBep";
        const PROJECT_NAMES = [
            "快閃店小型陳列架製作",
            "連鎖門市展示架製作",
            "台北商辦大廳木作工程",
            "企業辦公室裝修木作",
            "住宅系統櫃訂製工程",
            "博物館展示櫃體製作工程"
        ];
        const CATEGORIES = ["估價", "設計", "工程", "安裝", "返工"];

        async function main() {
            await liff.init({ liffId: LIFF_ID });

            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            const profile = await liff.getProfile();
            const userId = profile.userId;
            const avatarText = profile.displayName.charAt(0).toUpperCase();

            document.getElementById("app").innerHTML = `
                <div class="container">
                    <div class="header">
                        <div class="avatar">${avatarText}</div>
                        <div class="greeting">你好，${profile.displayName}</div>
                        <div class="subtitle">請選擇專案與類別後打卡</div>
                    </div>
                    <div class="tabs">
                        <button class="tab active" data-tab="clock">打卡</button>
                        <button class="tab" data-tab="stats">統計</button>
                    </div>
                    <div id="clockTab" class="tab-content active">
                        <div id="clockWarning" class="warning-box" role="alert">請先選擇專案名稱與類別，才能進行打卡。</div>
                        <div class="form-group">
                            <label class="field-label" for="selectProject">專案名稱</label>
                            <select id="selectProject" class="field-select">
                                <option value="">請選擇專案</option>
                                ${PROJECT_NAMES.map(p => `<option value="${p}">${p}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="field-label" for="selectCategory">類別</label>
                            <select id="selectCategory" class="field-select">
                                <option value="">請選擇類別</option>
                                ${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
                            </select>
                        </div>
                        <div class="button-group">
                            <button id="clockIn" class="btn btn-clock-in">📅 上班打卡</button>
                            <button id="clockOut" class="btn btn-clock-out">🏠 下班打卡</button>
                        </div>
                        <div id="result" class="result">
                            <div style="color: #86868b; font-size: 14px;">等待打卡...</div>
                        </div>
                    </div>
                    <div id="statsTab" class="tab-content">
                        <div id="statsContent">
                            <div class="loading">
                                <div class="spinner"></div>
                                <div class="loading-text">載入統計資料...</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.querySelectorAll('.tab').forEach(tab => {
                tab.onclick = () => {
                    const targetTab = tab.dataset.tab;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`${targetTab}Tab`).classList.add('active');
                    if (targetTab === 'stats') loadStatistics(userId);
                };
            });

            document.getElementById("clockIn").onclick = () => sendAttendance(userId, "clock_in");
            document.getElementById("clockOut").onclick = () => sendAttendance(userId, "clock_out");

            // 選擇後隱藏警告、移除欄位警示樣式
            ['selectProject', 'selectCategory'].forEach(id => {
                document.getElementById(id).addEventListener('change', () => {
                    const w = document.getElementById("clockWarning");
                    if (w) w.classList.remove('visible');
                    document.getElementById("selectProject").classList.remove('warning');
                    document.getElementById("selectCategory").classList.remove('warning');
                });
            });
        }

        function showClockWarning() {
            const w = document.getElementById("clockWarning");
            if (w) w.classList.add('visible');
            const p = document.getElementById("selectProject");
            const c = document.getElementById("selectCategory");
            if (p && p.value === '') p.classList.add('warning');
            if (c && c.value === '') c.classList.add('warning');
        }

        function sendAttendance(userId, actionType) {
            const project = (document.getElementById("selectProject") || {}).value;
            const category = (document.getElementById("selectCategory") || {}).value;
            if (!project || !category) {
                showClockWarning();
                return;
            }

            const clockInBtn = document.getElementById("clockIn");
            const clockOutBtn = document.getElementById("clockOut");
            const resultDiv = document.getElementById("result");
            clockInBtn.disabled = true;
            clockOutBtn.disabled = true;
            document.getElementById("clockWarning").classList.remove('visible');
            document.getElementById("selectProject").classList.remove('warning');
            document.getElementById("selectCategory").classList.remove('warning');

            resultDiv.className = "result";
            resultDiv.innerHTML = '<div class="spinner" style="width: 30px; height: 30px; border-width: 3px;"></div><div style="margin-top: 8px; color: #86868b;">處理中...</div>';

            // 模擬短暫延遲後顯示成功（假數據模式，不寫入資料庫）
            const localTime = new Date().toLocaleString('zh-TW', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            setTimeout(() => {
                resultDiv.className = "result success";
                resultDiv.innerHTML = `
                    <div class="result-icon">${actionType === "clock_in" ? "✅" : "🏠"}</div>
                    <div class="result-text">${actionType === "clock_in" ? "上班打卡成功！" : "下班打卡成功！"}</div>
                    <div class="result-time">${localTime}</div>
                    <div class="result-time" style="margin-top: 4px; font-size: 11px;">${project} · ${category}</div>
                `;
                clockInBtn.disabled = false;
                clockOutBtn.disabled = false;
            }, 400);
        }

        /** 產生假打卡記錄（含專案、類別），可依專案/類別篩選；用於呈現趨勢 */
        function getFakeAttendanceRecords(userId, days = 30, projectFilter, categoryFilter) {
            const records = [];
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - days);
            const seed = (userId || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);

            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                const dayOfWeek = d.getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) continue;
                const daySeed = seed + d.getTime();
                // 每天產生 2 組打卡（不同專案/類別），讓「全部」與篩選都有趨勢可看
                for (let i = 0; i < 2; i++) {
                    const pi = (daySeed + i * 7) % PROJECT_NAMES.length;
                    const ci = (daySeed + i * 11 + 1) % CATEGORIES.length;
                    const project = PROJECT_NAMES[pi];
                    const category = CATEGORIES[ci];
                    if (projectFilter && project !== projectFilter) continue;
                    if (categoryFilter && category !== categoryFilter) continue;
                    const inHour = 8 + (i === 0 ? 0 : 1);
                    const outHour = 17 + (i % 2);
                    records.push({
                        user_id: userId,
                        type: 'clock_in',
                        timestamp: new Date(d.getFullYear(), d.getMonth(), d.getDate(), inHour, (daySeed % 20), 0).toISOString(),
                        project_name: project,
                        category: category
                    });
                    records.push({
                        user_id: userId,
                        type: 'clock_out',
                        timestamp: new Date(d.getFullYear(), d.getMonth(), d.getDate(), outHour, 20 + (daySeed % 40), 0).toISOString(),
                        project_name: project,
                        category: category
                    });
                }
            }
            return records.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        }

        function calculateWorkHours(records) {
            const byKey = {};
            records.forEach(record => {
                const date = new Date(record.timestamp);
                const dateKey = date.toISOString().split('T')[0];
                const key = dateKey + '|' + (record.project_name || '') + '|' + (record.category || '');
                if (!byKey[key]) byKey[key] = { clockIn: null, clockOut: null };
                if (record.type === 'clock_in') byKey[key].clockIn = date;
                else if (record.type === 'clock_out') byKey[key].clockOut = date;
            });
            const byDate = {};
            Object.keys(byKey).sort().forEach(key => {
                const day = byKey[key];
                if (day.clockIn && day.clockOut) {
                    const hours = (day.clockOut - day.clockIn) / (1000 * 60 * 60);
                    const dateKey = key.split('|')[0];
                    if (!byDate[dateKey]) byDate[dateKey] = 0;
                    byDate[dateKey] += parseFloat(hours.toFixed(2));
                }
            });
            return Object.keys(byDate).sort().map(date => ({ date, hours: byDate[date] }));
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        function formatHours(hours) {
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            return m > 0 ? `${h}小時${m}分鐘` : `${h}小時`;
        }

        function bindStatsFilters(userId) {
            const p = document.getElementById("statsProject");
            const c = document.getElementById("statsCategory");
            if (p) p.onchange = () => loadStatistics(userId);
            if (c) c.onchange = () => loadStatistics(userId);
        }

        function loadStatistics(userId) {
            const statsContent = document.getElementById("statsContent");
            const currentProject = (document.getElementById("statsProject") && document.getElementById("statsProject").value) || '全部';
            const currentCategory = (document.getElementById("statsCategory") && document.getElementById("statsCategory").value) || '全部';

            try {
                const projectFilter = currentProject === '全部' ? null : currentProject;
                const categoryFilter = currentCategory === '全部' ? null : currentCategory;
                const records = getFakeAttendanceRecords(userId, 30, projectFilter, categoryFilter);
                const hoursData = calculateWorkHours(records);

                const projectOptions = '<option value="全部">全部專案</option>' + PROJECT_NAMES.map(p => 
                    `<option value="${p}" ${currentProject === p ? 'selected' : ''}>${p}</option>`
                ).join('');
                const categoryOptions = '<option value="全部">全部類別</option>' + CATEGORIES.map(c => 
                    `<option value="${c}" ${currentCategory === c ? 'selected' : ''}>${c}</option>`
                ).join('');

                if (hoursData.length === 0) {
                    statsContent.innerHTML = `
                        <div class="stats-filters">
                            <div class="form-group">
                                <label class="field-label">專案</label>
                                <select id="statsProject" class="field-select">${projectOptions}</select>
                            </div>
                            <div class="form-group">
                                <label class="field-label">類別</label>
                                <select id="statsCategory" class="field-select">${categoryOptions}</select>
                            </div>
                        </div>
                        <div style="text-align: center; padding: 40px; color: #86868b;">
                            <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
                            <div>此條件下尚無打卡記錄（假數據）</div>
                        </div>
                    `;
                    bindStatsFilters(userId);
                    return;
                }

                const totalHours = hoursData.reduce((sum, day) => sum + day.hours, 0);
                const avgHours = totalHours / hoursData.length;
                const thisWeekHours = hoursData
                    .filter(day => {
                        const dayDate = new Date(day.date);
                        const weekAgo = new Date();
                        weekAgo.setDate(weekAgo.getDate() - 7);
                        return dayDate >= weekAgo;
                    })
                    .reduce((sum, day) => sum + day.hours, 0);
                const workDays = hoursData.length;
                const recentDays = hoursData.slice(-7);
                const chartLabels = recentDays.length > 0 ? recentDays.map(day => formatDate(day.date)) : [];
                const chartData = recentDays.length > 0 ? recentDays.map(day => day.hours) : [];

                statsContent.innerHTML = `
                    <div class="stats-filters">
                        <div class="form-group">
                            <label class="field-label">專案</label>
                            <select id="statsProject" class="field-select">${projectOptions}</select>
                        </div>
                        <div class="form-group">
                            <label class="field-label">類別</label>
                            <select id="statsCategory" class="field-select">${categoryOptions}</select>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${formatHours(totalHours)}</div>
                            <div class="stat-label">總工時</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${formatHours(avgHours)}</div>
                            <div class="stat-label">平均每日</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${formatHours(thisWeekHours)}</div>
                            <div class="stat-label">本週工時</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${workDays}</div>
                            <div class="stat-label">工作天數</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div class="chart-title">最近7天工時趨勢</div>
                        <div class="chart-wrapper">
                            <canvas id="dailyHoursChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div class="chart-title">每日工時分佈</div>
                        <div class="chart-wrapper">
                            <canvas id="hoursDistributionChart"></canvas>
                        </div>
                    </div>
                `;
                bindStatsFilters(userId);

                setTimeout(() => {
                    if (typeof Chart === 'undefined') {
                        statsContent.innerHTML += `
                            <div style="text-align: center; padding: 20px; color: #ff3b30;">
                                <div>圖表庫載入失敗，請重新整理頁面</div>
                            </div>
                        `;
                        return;
                    }

                    // 創建每日工時折線圖
                    const dailyCtx = document.getElementById('dailyHoursChart');
                    if (!dailyCtx) {
                        console.error('找不到 dailyHoursChart canvas');
                        return;
                    }
                    
                    console.log('創建折線圖...');
                    new Chart(dailyCtx.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: '工時（小時）',
                            data: chartData,
                            borderColor: '#007aff',
                            backgroundColor: 'rgba(0, 122, 255, 0.08)',
                            borderWidth: 2.5,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#007aff',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `工時: ${formatHours(context.parsed.y)}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return value + 'h';
                                    }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                }
                            }
                        }
                    }
                    });

                    // 創建每日工時長條圖
                    const distCtx = document.getElementById('hoursDistributionChart');
                    if (!distCtx) {
                        console.error('找不到 hoursDistributionChart canvas');
                        return;
                    }
                    
                    console.log('創建長條圖...');
                    new Chart(distCtx.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: '工時（小時）',
                            data: chartData,
                            backgroundColor: chartData.map((_, i) => 
                                `rgba(0, 122, 255, ${0.2 + (i / chartData.length) * 0.5})`
                            ),
                            borderColor: '#007aff',
                            borderWidth: 1,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `工時: ${formatHours(context.parsed.y)}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return value + 'h';
                                    }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                }
                            }
                        }
                    }
                    });
                    
                    console.log('圖表創建完成！');
                }, 100); // 給 DOM 一點時間更新

            } catch (error) {
                statsContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ff3b30;">
                        <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                        <div>載入統計資料失敗</div>
                        <div style="font-size: 12px; margin-top: 8px; color: #86868b;">${error.message}</div>
                    </div>
                `;
                console.error("Error loading statistics:", error);
            }
        }

        main();
    </script>
</body>
</html>
